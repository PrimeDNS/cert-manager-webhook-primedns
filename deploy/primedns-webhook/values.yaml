# The API group of the webhook. Referenced as groupName in the issuer's webhook solver; leave it as it is.
groupName: acme.primedns.net

certManager:
  namespace: cert-manager
  serviceAccountName: cert-manager

image:
  repository: ghcr.io/primedns/cert-manager-webhook-primedns
  tag: ""   # empty = the chart appVersion
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 443

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
